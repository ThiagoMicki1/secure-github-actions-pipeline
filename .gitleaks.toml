title = "Secure GitHub Actions Pipeline Gitleaks Config"

[extend]
useDefault = true

[[allowlists]]
description = "Allow clearly sanitized fake examples used in documentation only"
paths = [
  '''docs/sanitized-insecure-example.md''',
  '''reports/sample-security-report.txt'''
]
regexes = [
  '''SANITIZED_[A-Z0-9_]+''',
  '''fake_[A-Za-z0-9_]+''',
  '''example_[A-Za-z0-9_]+'''
]

[[allowlists]]
description = "Ignore local generated folders that are not committed"
paths = [
  '''\.venv/.*''',
  '''venv/.*''',
  '''\.pytest_cache/.*''',
  '''reports/local/.*'''
]
